version: '3.8'

services:
  backend-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - lelya-network

  bot:
    build: .
    command: python app/bot/main.py
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - lelya-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lelya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lelya-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - lelya-network

networks:
  lelya-network:
    driver: bridge

volumes:
  postgres_data:
